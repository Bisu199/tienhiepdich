<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <title>Tiên Hiệp Dịch Thuật</title>
  <style>
    :root {
      --color-primary: #1e3a5f;
      --color-primary-hover: #162d4a;
      --color-primary-soft: rgba(30, 58, 95, 0.1);
      --color-primary-ring: rgba(30, 58, 95, 0.25);
      --color-surface: #fdf8ec;
      --color-surface-2: #fdf3d0;
      --color-border: rgba(30, 58, 95, 0.1);
      --color-border-strong: rgba(30, 58, 95, 0.18);
      --color-text: #1e3a5f;
      --color-text-secondary: #2d5282;
      --color-text-tertiary: #6b8cae;
      --radius-sm: 8px;
      --radius-md: 12px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 288px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-text);
      background: var(--color-surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
      color: #f0d070;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px -2px rgba(30, 58, 95, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    .brand-title .name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
      color: var(--color-text);
    }

    .brand-title .sub {
      font-size: 11px;
      color: var(--color-text-tertiary);
      margin-top: 1px;
    }

    .hint {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin: 0 0 14px;
    }

    .btn {
      width: 100%;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 150ms var(--ease), color 150ms var(--ease),
                  border-color 150ms var(--ease), transform 100ms var(--ease), box-shadow 150ms var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.005em;
    }

    .btn + .btn { margin-top: 8px; }

    .btn-primary {
      background: var(--color-primary);
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(30,58,95,0.2), 0 4px 12px -2px rgba(30,58,95,0.25);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 2px 4px rgba(30,58,95,0.25), 0 8px 16px -4px rgba(30,58,95,0.3);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--color-primary-ring); }

    .btn-ghost {
      background: transparent;
      color: var(--color-text-secondary);
      border-color: var(--color-border-strong);
    }
    .btn-ghost:hover {
      background: var(--color-surface-2);
      color: var(--color-text);
      border-color: var(--color-primary);
    }
    .btn-ghost:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--color-primary-ring); }

    .btn[disabled] { opacity: 0.55; cursor: not-allowed; transform: none !important; }

    .divider { height: 1px; background: var(--color-border); margin: 12px -16px; }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--color-text-tertiary);
      min-height: 16px;
      line-height: 1.4;
    }
    .status.info { color: var(--color-text-secondary); }
    .status.success { color: #059669; }
    .status.error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <!-- Scroll/book icon mang ý nghĩa dịch thuật cổ điển -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        <line x1="9" y1="9" x2="15" y2="9"></line>
        <line x1="9" y1="13" x2="13" y2="13"></line>
      </svg>
    </div>
    <div class="brand-title">
      <div class="name">⚡ Tiên Hiệp Dịch Thuật</div>
      <div class="sub">Made by Lucas &amp; Claude</div>
    </div>
  </div>

  <p class="hint">Translate this page to Vietnamese.</p>

  <button id="translateBtn" class="btn btn-primary" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
    <span>Translate</span>
  </button>
  <button id="excludeBtn" class="btn btn-ghost" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
    </svg>
    <span>Exclude this site</span>
  </button>
  <button id="optionsBtn" class="btn btn-ghost" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
    <span>Settings</span>
  </button>

  <div class="status" id="statusText" role="status" aria-live="polite"></div>

  <script src="translations.js"></script>
  <script src="popup.js"></script>
</body>
</html>
